<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>وقفة</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="وقفة">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#faf8f2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;600;700&family=Amiri&display=swap">
<style>
:root{
  --ink:#1b1b1b;--cream:#faf8f2;--fog:#edf1e7;--white:#fffdf7;--forest:#1c9151;--forest-deep:#0a4f2c;
  --lime:#d3ecdc;--amber:#fbe7c2;--line:#dde2d6;--muted:#5a675e;--neon:#7fdca6;--alert:#c8101b;
  --ease:cubic-bezier(0.22,1,0.36,1);--font:'IBM Plex Sans Arabic','IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.75;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
body.lock{overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
input,textarea,select{font-size:16px!important}
button{cursor:pointer;background:none;border:0;padding:0}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
bdi{unicode-bidi:isolate}
.wrap{max-width:560px;margin:0 auto;padding:24px 0 calc(120px + var(--safe-b));display:flex;flex-direction:column;gap:20px}
h1,h2,h3,p{margin:0}
.eyebrow{font-size:13px;font-weight:600;color:var(--muted)}
.title{font-size:30px;font-weight:700;line-height:1.3}
.lead{color:var(--muted);font-size:14px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.top .tt{display:flex;flex-direction:column;gap:2px;min-width:0}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--white);display:grid;place-items:center;flex:0 0 42px;color:var(--ink)}
.iconbtn svg{width:20px;height:20px}
.back{display:flex;align-items:center;gap:10px}
.card{background:var(--white);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px}
.card h2{font-size:18px;font-weight:600}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--muted)}.small{font-size:13px}
.btn{border-radius:999px;font-weight:600;font-size:14px;padding:11px 20px;background:var(--forest);color:#fff;transition:background .2s}
.btn:active{background:var(--forest-deep)}
.btn.ghost{background:var(--white);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:7px 14px;font-size:13px}
.btn.block{width:100%}
.btn.danger{background:none;color:var(--alert);border:1px solid var(--line)}
.link{color:var(--forest);font-weight:600;font-size:14px}
.badge{display:inline-block;border-radius:999px;padding:1px 12px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--fog);color:var(--muted)}
.badge.done{background:var(--lime);color:var(--forest-deep)}.badge.part{background:var(--amber);color:#7a4b00}.badge.miss{background:rgba(200,16,27,.08);color:var(--alert)}
.badge.ink{background:var(--ink);color:#fff}
.notice{border-radius:14px;border-inline-start:3px solid var(--forest);background:var(--fog);padding:12px 16px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.inp{width:100%;border-radius:14px;border:1px solid var(--line);background:var(--white);padding:10px 16px;outline:0;transition:border .2s,box-shadow .2s}
.inp:focus{border-color:var(--forest);box-shadow:0 0 0 4px rgba(28,145,81,.15)}
textarea.inp{min-height:84px;resize:vertical;line-height:1.7}
.row-in{display:flex;gap:8px;align-items:center}
.row-in .inp{flex:1;min-width:0}
/* hero */
.hero{background:var(--ink);color:#fff;border-radius:24px;padding:20px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{position:relative;width:104px;height:104px}
.ring svg{width:104px;height:104px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .bg{stroke:rgba(255,255,255,.12)}.ring .fg{stroke:var(--neon);transition:stroke-dashoffset .9s var(--ease)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring .v b{font-size:26px;font-weight:700}.ring .v span{font-size:11px;color:rgba(255,255,255,.6)}
.hero .np{display:flex;flex-direction:column;gap:2px;min-width:0}
.hero .np .eyebrow{color:rgba(255,255,255,.6)}
.hero .np b{font-size:22px;font-weight:700}
.hero .np .cd{color:var(--neon);font-weight:600;font-size:14px}
.hero .times{grid-column:1/-1;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center;font-size:12px;color:rgba(255,255,255,.6)}
.hero .times div{border-radius:12px;padding:6px 0;background:rgba(255,255,255,.06)}
.hero .times b{display:block;color:#fff;font-size:13px;font-weight:600}
.hero .times .cur{background:var(--neon);color:var(--ink)}.hero .times .cur b{color:var(--ink)}
.hero .mine{grid-column:1/-1;background:rgba(127,220,166,.12);border-radius:14px;padding:10px 14px;font-size:14px}
.hero .mine b{color:var(--neon)}
.hero .ready{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:10px;background:rgba(255,255,255,.08);border-radius:14px;padding:10px 14px;font-size:14px}
/* checklist */
.check{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.check:first-of-type{border-top:0}
.tick{width:26px;height:26px;flex:0 0 26px;border-radius:8px;border:1.5px solid var(--line);display:grid;place-items:center;margin-top:2px;transition:all .2s var(--ease)}
.tick svg{width:16px;height:16px;opacity:0;color:#fff}
.tick[aria-pressed="true"]{background:var(--forest);border-color:var(--forest)}.tick[aria-pressed="true"] svg{opacity:1}
.check .t{flex:1;min-width:0;display:flex;flex-direction:column}
.check.done .t>span:first-child{color:var(--muted);text-decoration:line-through}
.x{color:var(--muted);width:30px;height:30px;display:grid;place-items:center;border-radius:50%;flex:0 0 30px}
.x svg{width:16px;height:16px}
.meter{height:6px;border-radius:3px;background:var(--fog);overflow:hidden}
.meter i{display:block;height:100%;background:var(--forest);border-radius:3px;transition:width .6s var(--ease)}
/* filters */
.filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.filters::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--white);border-radius:999px;padding:6px 14px;font-size:14px;white-space:nowrap;transition:all .2s var(--ease)}
.chip[aria-pressed="true"]{background:var(--lime);border-color:var(--forest);color:var(--forest-deep);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
/* timeline */
.slot{display:flex;flex-direction:column;gap:8px}
.slot-h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted);padding-inline:4px}
.slot-h .tm{margin-inline-start:auto;font-weight:400}
.slot-h .now{background:var(--forest);color:#fff;border-radius:999px;padding:0 10px;font-size:11px}
.list{background:var(--white);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;text-align:start;border-top:1px solid var(--line);transition:background .15s}
.row:first-child{border-top:0}
.row:active{background:var(--fog)}
.ic{width:40px;height:40px;flex:0 0 40px;border-radius:12px;background:var(--fog);display:grid;place-items:center;color:var(--forest-deep)}
.ic svg{width:20px;height:20px}
.row.st-done .ic{background:var(--lime)}
.row .t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.5}
.row .t b{font-weight:600;font-size:15px}
.row .t span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(27,27,27,.4);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--cream);width:100%;max-width:600px;max-height:94vh;border-radius:28px 28px 0 0;display:flex;flex-direction:column;animation:up .35s var(--ease)}
.sheet .sh-h{padding:10px 20px 12px;display:flex;flex-direction:column;gap:4px;border-bottom:1px solid var(--line)}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 8px}
.sheet .sh-h .title{font-size:22px}
.sheet .sh-b{overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:22px;overscroll-behavior:contain}
.sheet .sh-f{padding:12px 20px calc(12px + var(--safe-b));border-top:1px solid var(--line);display:flex;gap:10px;background:var(--cream)}
.sheet .sh-f .btn{flex:1}
@keyframes up{from{transform:translateY(40px);opacity:.4}}@keyframes fade{from{opacity:0}}
.sec{display:flex;flex-direction:column;gap:16px}
.sec>h3{font-size:13px;font-weight:600;color:var(--muted)}
.sec.heart>h3{color:var(--forest-deep)}
.sec.heart{background:var(--white);border:1px solid var(--line);border-radius:20px;padding:16px}
.fld{display:flex;flex-direction:column;gap:8px}
.fld>label,.fld>.lb{font-size:14px;font-weight:600}
/* segmented */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fog);border-radius:999px;padding:4px;gap:4px}
.seg button{border-radius:999px;padding:8px 6px;font-size:14px;line-height:1.35;color:var(--ink);transition:all .25s var(--ease)}
.seg button[aria-pressed="true"]{background:var(--forest);color:#fff;font-weight:600}
.seg.long{grid-auto-flow:row;grid-auto-columns:auto;border-radius:18px}
.seg.long button{border-radius:14px;text-align:start;padding:10px 14px}
/* stepper */
.stepper{display:flex;align-items:center;gap:12px}
.stepper button.sb{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--white);font-size:24px;line-height:1;display:grid;place-items:center}
.stepper input{width:90px;text-align:center;font-size:28px!important;font-weight:700;border:0;background:none;padding:0;outline:0;-moz-appearance:textfield}
.stepper input::-webkit-inner-spin-button{display:none}
.stepper .u{color:var(--muted);font-size:14px}
.quick{display:flex;gap:8px}
.crow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.crow:first-of-type{border-top:0}
.crow .n{flex:1;font-size:15px}
.crow .mini{display:flex;align-items:center;gap:6px}
.crow .mini button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--white);font-size:18px}
.crow .mini input{width:58px;text-align:center;border:1px solid var(--line);border-radius:10px;background:var(--white);padding:4px;font-weight:600}
.crow .g{font-size:12px;color:var(--muted);width:44px}
.crow .g.ok{color:var(--forest);font-weight:600}
.missbtn{align-self:flex-start;color:var(--muted);font-size:13px;text-decoration:underline}
/* review wizard */
.wz-bar{display:flex;gap:4px}
.wz-bar i{flex:1;height:4px;border-radius:2px;background:var(--line);transition:background .3s}
.wz-bar i.on{background:var(--forest)}
.wz-nav{position:fixed;inset:auto 0 0 0;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(14px + var(--safe-b));background:linear-gradient(transparent,var(--cream) 30%);display:flex;justify-content:center;z-index:30}
.wz-nav div{display:flex;gap:10px;width:100%;max-width:560px}
.wz-nav .btn{flex:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--fog);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:22px;font-weight:700}.stat span{font-size:12px;color:var(--muted)}
.point{display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:1px solid var(--line)}
.point:first-of-type{border-top:0;padding-top:0}
.point b{font-weight:600;font-size:15px}
/* progress */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal .dn{font-size:11px;color:var(--muted)}
.cal button{aspect-ratio:1;border-radius:10px;font-size:13px;font-weight:600;background:var(--fog);color:var(--muted)}
.cal button.l1{background:#e6f2ea;color:var(--forest-deep)}.cal button.l2{background:var(--lime);color:var(--forest-deep)}
.cal button.l3{background:var(--neon);color:var(--forest-deep)}.cal button.l4{background:var(--forest);color:#fff}
.cal button.today{outline:2px solid var(--ink);outline-offset:1px}
.cal button.fut{opacity:.35}
.chart{display:flex;flex-direction:column;gap:6px;padding-top:14px;border-top:1px solid var(--line)}
.chart:first-of-type{border-top:0;padding-top:0}
.chart .ch b{font-size:20px}
.spark{width:100%;height:56px;overflow:visible}
.spark polyline{fill:none;stroke:var(--forest);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.spark .area{fill:var(--lime);opacity:.6;stroke:none}
.spark .base{stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke}
.insight{display:flex;flex-direction:column;gap:8px}
.bar-row{display:grid;grid-template-columns:1fr 2fr auto;gap:10px;align-items:center;font-size:14px}
.seg-tabs{display:flex;gap:20px;border-bottom:1px solid var(--line)}
.seg-tabs button{padding:8px 0;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.seg-tabs button[aria-pressed="true"]{color:var(--ink);border-color:var(--forest)}
.note-c{display:flex;flex-direction:column;gap:6px;padding:14px 0;border-top:1px solid var(--line)}
.note-c:first-of-type{border-top:0}
.note-c p{white-space:pre-wrap;font-size:15px}
.dua{font-family:'Amiri',serif;font-size:19px;line-height:2}
.empty{color:var(--muted);text-align:center;padding:12px}
.ayah{font-family:'Amiri',serif;font-size:18px;color:var(--muted);text-align:center}
input[type=range]{width:100%;accent-color:var(--forest)}
.ed-f{border:1px dashed var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--white)}
.tag{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);background:var(--white);border-radius:999px;padding:3px 6px 3px 12px;font-size:13px}
.tag .x{width:22px;height:22px;flex-basis:22px}
.journey{display:flex;align-items:center;gap:14px}
.card.journey{flex-direction:row;align-items:center}
.journey .t{flex:1;display:flex;flex-direction:column;gap:6px}
.journey>svg,.row>svg{width:20px;height:20px;flex:0 0 20px;color:var(--muted)}
/* nav */
nav.tabs{position:fixed;inset:auto 0 0 0;z-index:40;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(8px + var(--safe-b)) max(12px,env(safe-area-inset-left,0px));display:flex;justify-content:center;pointer-events:none}
nav.tabs>div{pointer-events:auto;width:100%;max-width:520px;background:var(--ink);border-radius:26px;display:flex;align-items:center;padding:6px;box-shadow:0 10px 30px rgba(27,27,27,.18)}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:rgba(255,255,255,.62);font-size:11px;font-weight:600;padding:6px 0;border-radius:18px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--neon)}
nav.tabs button.plus{flex:0 0 56px;height:48px;background:var(--forest);color:#fff;border-radius:18px;margin:0 4px}
nav.tabs button.plus svg{width:26px;height:26px}
body.wz nav.tabs{display:none}
.hb{display:flex;align-items:center;gap:8px}
.hero .sched{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:10px;background:rgba(255,255,255,.07);border-radius:16px;padding:12px 14px;text-align:start;color:#fff}
.hero .sched>span{display:flex;flex-direction:column;line-height:1.45}
.hero .sched .eyebrow{color:rgba(255,255,255,.55)}.hero .sched b{font-size:15px;font-weight:600}
.hero .sched .cd{color:var(--neon);font-size:13px;font-weight:600}
.hero .locl{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:rgba(255,255,255,.55)}
.hero .locl button{color:var(--neon);font-weight:600;font-size:12px}
.ncards{display:flex;flex-direction:column;gap:10px}
.ncard{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:14px 16px;text-align:start;display:flex;flex-direction:column;gap:8px;width:100%}
.ncard p{font-size:15px;line-height:1.85;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.ncard .nm{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.star{color:#b77d00;font-size:16px;line-height:1}
.fcard{background:var(--fog);border-color:transparent}
.ftext{font-size:17px;line-height:1.9;font-weight:600;white-space:pre-wrap}
.tmc{display:flex;flex-direction:column;align-items:center;min-width:54px;line-height:1.3}.tmc b{font-size:15px}.tmc span{font-size:11px;color:var(--muted)}
.row.cur{background:var(--fog)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + var(--safe-b));background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:60;animation:up .3s var(--ease)}
.rise{animation:rise .5s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<nav class="tabs" aria-label="التنقل"><div>
  <button data-tab="today" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-5h4v5"/></svg>اليوم</button>
  <button data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>التقدّم</button>
  <button class="plus" data-act="quick" aria-label="إضافة سريعة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button data-tab="notes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>طلعت بإيه</button>
  <button data-tab="zad"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>زادي</button>
</div></nav>
<script>
(()=>{
const KEY='waqfa.v1';
/* ================= icons ================= */
const P={salah:'<path d="M4 20h16M6 20v-8a6 6 0 0 1 12 0v8M12 6V3"/>',dhikr:'<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16M8 12h8"/>',fardi:'<path d="M4 5h16v11H9l-5 4z"/>',

const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
function dsMin(){const [h,m]=(db?db.settings.dayStart:'03:30').split(':').map(Number);return h*60+m}
function dayKey(){const now=new Date(),d=new Date(now);if(now.getHours()*60+now.getMinutes()<dsMin())d.setDate(d.getDate()-1);return keyOf(d)}
function fromKey(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d,12)}
function shift(k,n){const d=fromKey(k);d.setDate(d.getDate()+n);return keyOf(d)}
function diffDays(a,b){return Math.round((fromKey(b)-fromKey(a))/864e5)}
function fmt(k,o){try{return new Intl.DateTimeFormat('ar-EG-u-nu-latn',o).format(fromKey(k))}catch(e){return k}}
function hijri(k){try{return new Intl.DateTimeFormat('ar-EG-u-ca-islamic-umalqura-nu-latn',{day:'numeric',month:'long'}).format(fromKey(k))}catch(e){return ''}}
const num=(n,s='')=>`<bdi>${Number(n).toLocaleString('en-US',{maximumFractionDigits:1})}${s}</bdi>`;
function hm(min){min=((Math.round(min)%1440)+1440)%1440;const h=Math.floor(min/60),m=min%60;return `<bdi>${((h+11)%12)+1}:${pad(m)}</bdi>`}
function until(d){d=Math.max(0,Math.round(d));const h=Math.floor(d/60),m=d%60;return h?`${num(h)} س ${num(m)} د`:`${num(m)} دقيقة`}
const R=Math.PI/180,sn=d=>Math.sin(d*R),cs=d=>Math.cos(d*R),tn=d=>Math.tan(d*R),asn=x=>Math.asin(x)/R,acs=x=>Math.acos(Math.max(-1,Math.min(1,x)))/R,at2=(y,x)=>Math.atan2(y,x)/R,acot=x=>Math.atan(1/x)/R,fix=(a,b)=>{a=a-b*Math.floor(a/b);return a<0?a+b:a};
function julian(y,m,d){if(m<=2){y-=1;m+=12}const A=Math.floor(y/100),B=2-A+Math.floor(A/4);return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5}
function sunPos(jd){const D=jd-2451545,g=fix(357.529+0.98560028*D,360),q=fix(280.459+0.98564736*D,360),L=fix(q+1.915*sn(g)+0.02*sn(2*g),360),e=23.439-0.00000036*D;const RA=fix(at2(cs(e)*sn(L),cs(L))/15,24);return{decl:asn(sn(e)*sn(L)),eqt:q/15-RA}}
function prayerTimes(date,lat,lng){const jd=julian(date.getFullYear(),date.getMonth()+1,date.getDate())-lng/(15*24),tz=-date.getTimezoneOffset()/60;
  const sp=t=>sunPos(jd+t/24),noon=t=>fix(12-sp(t).eqt,24);
  const ang=(a,t,ccw)=>{const p=sp(t);const T=acs((-sn(a)-sn(p.decl)*sn(lat))/(cs(p.decl)*cs(lat)))/15;return noon(t)+(ccw?-T:T)};
  const asr=t=>{const p=sp(t);return ang(-acot(1+tn(Math.abs(lat-p.decl))),t)};
  let t={fajr:5,sunrise:6,dhuhr:12,asr:13,maghrib:18,isha:18};
  for(let i=0;i<2;i++)t={fajr:ang(19.5,t.fajr,true),sunrise:ang(0.833,t.sunrise,true),dhuhr:noon(t.dhuhr),asr:asr(t.asr),maghrib:ang(0.833,t.maghrib),isha:ang(17.5,t.isha)};
  const out={};for(const k in t)out[k]=(t[k]+tz-lng/15)*60+(k==='dhuhr'?2:0);return out}

function metrics(k){const l=db.logs[k]||{},list=daily(k);let w=0,rec=0;list.forEach(d=>{const s=stOf(d,k);if(s)rec++;w+=W(s)});
  const pr=list.filter(d=>d.cat==='salah'&&d.st&&d.st.f==='perf');
  const heart=avg(pr.map(d=>score(findF(d,'heart')||{},ans(l[d.id],'heart'))));
  const quality=avg(list.flatMap(d=>(d.heart||[]).map(f=>score(f,ans(l[d.id],f.id)))));
  const adab=avg(list.filter(d=>d.cat==='adab').flatMap(d=>d.perf.map(f=>score(f,ans(l[d.id],f.id)))));
  const fc=ans(l.tazkiya,'f')||{},faults=Object.values(fc).reduce((s,x)=>s+Number(x||0),0);
  const pl=db.plans[k]||[],pd=pl.filter(x=>x.done).length;
  return {n:list.length,rec,pct:list.length?w/list.length:0,heart,quality,adab,faults,fc,plan:pl.length?pd/pl.length:null,pd,pn:pl.length,
    distract:pr.flatMap(d=>ans(l[d.id],'distract')||[])}}

const tick=(act,attrs,on)=>`<button class="tick" data-act="${act}" ${attrs} aria-pressed="${!!on}" aria-label="تم">${ico('ok')}</button>`;
const xbtn=(act,attrs,label='امسح')=>`<button class="x" data-act="${act}" ${attrs} aria-label="${label}">${ico('x')}</button>`;
function deedRow(d,k){const e=(db.logs[k]||{})[d.id],s=status(d,e,k),sm=summary(d,e,k);let ex='';
  if(d.period){const ps=periodStart(k,d.period);let when=null;for(let x=ps;x<=k;x=shift(x,1))if(stOf(d,x)==='done')when=x;ex=when?`اتعمل ${d.period==='week'?'الأسبوع ده':'الشهر ده'} يوم ${fmt(when,{weekday:'long'})}`:`لسه ما اتعملش ${d.period==='week'?'الأسبوع ده':'الشهر ده'}`}
  return `<button class="row st-${s||'none'}" data-act="open" data-id="${d.id}"><span class="ic">${ico(d.cat)}</span><span class="t"><b>${esc(dname(d,k))}</b><span>${esc(sm||ex||'اضغط للتسجيل')}</span></span>${badge(s)}</button>`}

/* ================= field rendering ================= */
function fieldHTML(d,f,e,k){if(!visible(f,e,k))return '';const v=ans(e,f.id),A=`data-id="${d.id}" data-f="${f.id}"`;
  let h=`<div class="fld">${f.type!=='counts'?`<span class="lb">${esc(f.label)}</span>`:''}`;
  if(f.type==='one'){const long=f.opts.length>3||f.opts.some(o=>o.length>20);
    h+=`<div class="seg ${long?'long':''}" role="radiogroup">${f.opts.map(o=>`<button role="radio" data-act="one" ${A} data-v="${esc(o)}" aria-pressed="${v===o}">${esc(o)}</button>`).join('')}</div>`;
    if(f.cmt){const c=((e||{}).c||{})[f.id]||'';h+=`<input class="inp" data-act="cmt" ${A} value="${esc(c)}" placeholder="تعليق">`}}
  else if(f.type==='many'){const arr=v||[];h+=`<div class="chips">${f.opts.map(o=>`<button class="chip" data-act="many" ${A} data-v="${esc(o)}" aria-pressed="${arr.includes(o)}">${esc(o)}</button>`).join('')}</div>`}
  else if(f.type==='num'){const n=Number(v||0),st=f.step||1;
    h+=`<div class="stepper"><button class="sb" data-act="inc" ${A} data-n="${-st}" aria-label="أقل">−</button><input type="number" inputmode="numeric" min="0" data-act="numin" ${A} value="${n||''}" placeholder="0"><button class="sb" data-act="inc" ${A} data-n="${st}" aria-label="أكتر">+</button><span class="u">${esc(f.unit||'')}${f.goal?` من ${num(f.goal)}`:''}</span></div>${f.goal?`<div class="meter"><i style="width:${Math.min(100,n/f.goal*100)}%"></i></div>`:''}`}
  else if(f.type==='text'){h+=`<textarea class="inp" data-act="text" ${A} placeholder="اكتب هنا">${esc(v||'')}</textarea>`}
  else if(f.type==='counts'){const c=v||{};h+=`<div>${f.items.map(it=>{const n=Number(c[it.n]||0);return `<div class="crow"><span class="n">${esc(it.n)}</span><span class="mini"><button data-act="cinc" ${A} data-k="${esc(it.n)}" data-n="-10">−</button><input type="number" inputmode="numeric" data-act="cnt" ${A} data-k="${esc(it.n)}" value="${n||''}" placeholder="0"><button data-act="cinc" ${A} data-k="${esc(it.n)}" data-n="33">+</button></span><span class="g ${n>=it.goal?'ok':''}">/ ${num(it.goal)}</span></div>`}).join('')}</div><p class="small muted">+ بيزوّد ٣٣، و− بينقص ١٠. وتقدر تكتب الرقم بإيدك.</p>`}
  else if(f.type==='faults'){const c=v||{};const fl=db.faults.filter(x=>x.on);
    h+=fl.length?`<div>${fl.map(x=>{const n=Number(c[x.id]||0);return `<div class="crow"><span class="n">${esc(x.name)}</span><span class="mini"><button data-act="finc" ${A} data-k="${x.id}" data-n="-1">−</button><input type="number" inputmode="numeric" data-act="fcnt" ${A} data-k="${x.id}" value="${n||''}" placeholder="0"><button data-act="finc" ${A} data-k="${x.id}" data-n="1">+</button></span><span class="g">مرة</span></div>`}).join('')}</div>`:'<p class="small muted">مفيش عيوب مفعّلة. فعّلها من مرآة العيوب.</p>';
    h+=`<button class="link" data-act="zad-go" data-v="faults" style="align-self:flex-start">مرآة العيوب ←</button>`}
  return h+'</div>'}
function deedBody(d,k){const e=(db.logs[k]||{})[d.id]||{a:{}};
  let h=`<div class="sec">${(d.perf||[]).map(f=>fieldHTML(d,f,e,k)).join('')}${d.st&&!d.st.f&&!d.st.avg?`<button class="missbtn" data-act="miss" data-id="${d.id}">${e.miss?'رجّعها: لسه هسجّل':'ما عملتوش النهارده'}</button>`:''}</div>`;
  if((d.heart||[]).length)h+=`<div class="sec heart"><h3>وقفة القلب</h3>${d.heart.map(f=>fieldHTML(d,f,e,k)).join('')}</div>`;
  if(!d.noClose)h+=`<div class="sec"><h3>بعد العمل</h3>${CLOSE.map(f=>fieldHTML(d,f,e,k)).join('')}</div>`;
  if(d.link==='shura'&&activeJ())h+=`<button class="btn ghost" data-act="go" data-v="shura">افتح المشورة</button>`;
  if(d.link==='duas')h+=`<button class="btn ghost" data-act="zad-go" data-v="duas">افتح أدعيتي</button>`;
  return h}

/* ================= sheet ================= */
let sheetEl=null,sheetRender=null;
function openSheet(renderFn,opts={}){closeSheet(true);sheetRender=renderFn;const s=document.createElement('div');s.className='scrim';
  s.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div class="sh-h"><div class="grab"></div><div class="hh"></div></div><div class="sh-b"></div><div class="sh-f"></div></div>`;
  s.addEventListener('click',ev=>{if(ev.target===s)closeSheet()});document.body.appendChild(s);
  const sh=s.querySelector('.sheet');let y0=null,x0=0,dy=0,drag=false;
  sh.addEventListener('touchstart',e=>{const b=sh.querySelector('.sh-b');if(e.target.closest('input[type=range]')){y0=null;return}if(e.target.closest('.sh-h')||(e.target.closest('.sh-b')&&b.scrollTop<=0)){y0=e.touches[0].clientY;x0=e.touches[0].clientX;dy=0;drag=false}else y0=null},{passive:true});
  sh.addEventListener('touchmove',e=>{if(y0==null)return;const d=e.touches[0].clientY-y0,dx=Math.abs(e.touches[0].clientX-x0);if(!drag){if(d>8&&d>dx){drag=true;sh.style.transition='none'}else if(d<-4||dx>8){y0=null;return}else return}
    dy=Math.max(0,d);sh.style.transform=`translateY(${dy}px)`;s.style.background=`rgba(27,27,27,${Math.max(.05,.4-dy/900)})`;if(e.cancelable)e.preventDefault()},{passive:false});
  sh.addEventListener('touchend',()=>{if(!drag){y0=null;return}sh.style.transition='transform .25s var(--ease)';if(dy>110){sh.style.transform='translateY(100%)';setTimeout(()=>closeSheet(),180)}else{sh.style.transform='';s.style.background=''}y0=null;drag=false});document.body.classList.add('lock');sheetEl=s;paintSheet()}
function paintSheet(keepScroll=true){if(!sheetEl)return;const r=sheetRender();const b=sheetEl.querySelector('.sh-b'),st=b.scrollTop;
  sheetEl.querySelector('.hh').innerHTML=r.head;b.innerHTML=r.body;sheetEl.querySelector('.sh-f').innerHTML=r.foot||'<button class="btn" data-act="close-sheet">تمام</button>';if(keepScroll)b.scrollTop=st}
function closeSheet(silent){if(sheetEl){sheetEl.remove();sheetEl=null;document.body.classList.remove('lock');if(!silent)render()}}
function openDeed(id,k=view.day){const d=byId(id);if(!d)return;
  openSheet(()=>{const s=stOf(d,k);return {head:`<div class="ch"><span class="eyebrow">${esc((CATS.find(c=>c[0]===d.cat)||[])[1]||'')}${k!==dayKey()?' · '+fmt(k,{weekday:'long',day:'numeric',month:'long'}):''}</span>${badge(s)}</div><h2 class="title">${esc(dname(d,k))}</h2>`,body:deedBody(d,k)}})}

/* ================= screens ================= */
function render(){
  document.querySelectorAll('nav.tabs [data-tab]').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===view.tab&&!view.sub?'page':'false'));
  const s=view.sub;let h;
  if(s==='review')h=renderReview();else if(s==='khuruj')h=renderKhuruj();else if(s==='shura')h=renderShura();else if(s==='settings')h=renderSettings();else if(s==='custom')h=renderCustom();else if(s==='cat')h=renderCat();else if(s==='sched')h=renderSched();
  else h=view.tab==='today'?renderToday():view.tab==='progress'?renderProgress():view.tab==='notes'?renderNotes():renderZad();
  $('#app').innerHTML=h;
  document.querySelectorAll('.wz-nav').forEach(x=>{if(view.sub!=='review')x.remove()});
  document.body.classList.toggle('wz',view.sub==='review');
  if(view.sub==='review')renderWzNav();
  if(sheetEl)paintSheet()}
function ring(p){const r=44,c=2*Math.PI*r;return `<div class="ring"><svg viewBox="0 0 104 104"><circle class="bg" cx="52" cy="52" r="${r}"/><circle class="fg" cx="52" cy="52" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}"/></svg><div class="v"><span><b>${num(Math.round(p*100),'%')}</b><br><span>من يومك</span></span></div></div>`}
function planCard(k,title='خطة النهارده',editable=true){const pl=plan(k),d=pl.filter(x=>x.done).length;
  return `<section class="card rise"><div class="ch"><h2>${title}</h2>${pl.length?`<span class="badge ${d===pl.length?'done':''}">${num(d)} من ${num(pl.length)}</span>`:''}</div>
   ${pl.length?`<div>${pl.map((x,i)=>`<div class="check ${x.done?'done':''}">${tick('pl-tog',`data-k="${k}" data-i="${i}"`,x.done)}<div class="t"><span>${esc(x.t)}</span></div>${editable?xbtn('pl-del',`data-k="${k}" data-i="${i}"`):''}</div>`).join('')}</div>`:'<p class="lead">مفيش خطوات لسه. اكتبها هنا، أو في محاسبة الليلة.</p>'}
   ${editable?`<div class="row-in"><input class="inp" id="pl-${k}" placeholder="أضف خطوة" enterkeyhint="done"><button class="btn sm" data-act="pl-add" data-k="${k}">أضف</button></div>`:''}</section>`}
function p40Card(k){if(!db.p40.length)return '';const d=db.p40.filter(it=>p40done(it,k)).length;
  return `<section class="card rise"><div class="ch"><h2>خطة الأربعين</h2><span class="hb"><span class="badge ${d===db.p40.length?'done':''}">${num(d)} من ${num(db.p40.length)}</span><button class="link" data-act="p40-edit">تعديل</button></span></div><div class="meter"><i style="width:${d/db.p40.length*100}%"></i></div>
   <div>${db.p40.map(it=>{const ok=p40done(it,k),auto=it.link&&byId(it.link);return `<div class="check ${ok?'done':''}">${tick('p40',`data-id="${it.id}"`,ok)}<div class="t"><span>${esc(it.text)}</span>${auto?`<span class="small muted">بيتعلّم لوحده لما تسجّل ${esc(auto.name)}</span>`:''}</div></div>`}).join('')}</div></section>`}
function renderToday(){
  const k=view.day,today=dayKey(),isT=k===today,m=metrics(k),w=windowNow(),j=activeJ();
  let h=top(`${fmt(k,{weekday:'long',day:'numeric',month:'long'})} · ${esc(hijri(k))}`,isT?'يومك':fmt(k,{weekday:'long'}),`<div class="hb"><button data-act="settings" aria-label="الحفظ أونلاين">${cloudChip()}</button>${gearBtn}</div>`);
  if(!isT)h+=`<div class="notice"><span>بتعرض يوم ${fmt(k,{day:'numeric',month:'long'})}</span><button class="link" data-act="go-today">رجوع لليوم</button></div>`;
  if(isT&&!auth)h+=`<div class="notice"><span>بياناتك على الموبايل ده بس. احفظها أونلاين عشان متضيعش.</span><button class="link" data-act="settings">احفظها</button></div>`;
  const lb=db.settings.lastBackup;if(isT&&auth&&0&&Object.keys(db.logs).length>3&&(!lb||diffDays(lb,today)>=7))h+=`<div class="notice"><span>بقالك أسبوع من غير نسخة احتياطية</span><button class="link" data-act="backup">خدها</button></div>`;
  if(isT){const P=w.P;let extra='';
    if(w.next.in<=10){const i=Math.min(view.ready,READY.length);extra+=`<div class="ready"><span>${i<READY.length?`${num(i+1)}. ${READY[i]}`:'جاهز، ربنا يتقبّل.'}</span>${i<READY.length?'<button class="btn sm" data-act="ready">تمام</button>':''}</div>`}
    if(j){const sh=(j.shura||{})[k];if(sh&&sh.assign){const mine=BAYANAT.concat(AMAL).filter(([id])=>sh.assign[id]&&sh.assign[id].mine);if(mine.length)extra+=`<div class="mine">عليك النهارده: <b>${mine.map(x=>x[1]).join('، ')}</b></div>`}}
    h+=`<section class="hero rise">${ring(m.pct)}<div class="np"><span class="eyebrow">الصلاة الجاية</span><b>${esc(w.next.name)} ${hm(w.next.at)}</b><span class="cd">بعد ${until(w.next.in)}</span><span class="small" style="color:rgba(255,255,255,.6)">سجّلت ${num(m.rec)} من ${num(m.n)} عمل</span></div>
     <div class="times">${[['fajr','الفجر'],['dhuhr','الظهر'],['asr','العصر'],['maghrib','المغرب'],['isha','العشاء']].map(([id,n])=>`<div class="${w.next.id===id?'cur':''}">${n}<b>${hm(P[id])}</b></div>`).join('')}</div>${schedHero()}${extra}${locLine()}</section>`}
  else h+=`<section class="hero rise">${ring(m.pct)}<div class="np"><span class="eyebrow">ملخص اليوم</span><b>سجّلت ${num(m.rec)} من ${num(m.n)}</b>${m.heart!=null?`<span class="cd">حضور القلب ${num(Math.round(m.heart*100),'%')}</span>`:''}</div></section>`;
  h+=planCard(k)+fawaidCard(k)+p40Card(k);
  h+=`<button class="card journey rise" data-act="go" data-v="khuruj" style="text-align:start"><span class="ic">${ico('map')}</span><span class="t"><b>${j?esc(JTYPES[j.type].label):'الخروج'}</b>${j?`<span class="small muted">اليوم ${num(Math.max(1,Math.min(jDay(j),j.days)))} من ${num(j.days)}</span><span class="meter"><i style="width:${Math.min(100,jDay(j)/j.days*100)}%"></i></span>`:'<span class="small muted">ابدأ خروج: ٣ أيام، أو ٤٠ يوم، أو ٤ شهور</span>'}</span>${ico('fwd')}</button>`;
  const cats=CATS.filter(c=>!['adab','nafs'].includes(c[0]));
  h+=`<div class="filters">${[['all','الكل']].concat(cats).map(([id,n])=>`<button class="chip" data-act="filter" data-v="${id}" aria-pressed="${view.filter===id}">${n}</button>`).join('')}</div>`;
  const tl=timeline(k).filter(d=>view.filter==='all'||d.cat===view.filter),P=timesFor(k),tm={fajr:P.fajr,duha:P.sunrise+15,dhuhr:P.dhuhr,asr:P.asr,maghrib:P.maghrib,isha:P.isha};
  SLOTS.forEach(([sid,sn])=>{const list=tl.filter(d=>d.slot===sid);if(!list.length)return;const cur=isT&&w.key===sid;
    h+=`<section class="slot rise"><div class="slot-h"><span>${sn}</span>${cur?'<span class="now">دلوقتي</span>':''}${tm[sid]?`<span class="tm">${hm(tm[sid])}</span>`:''}</div><div class="list">${list.map(d=>deedRow(d,k)).join('')}</div></section>`});
  const per=periodic(k).filter(d=>view.filter==='all'||d.cat===view.filter);
  if(per.length)h+=`<section class="slot rise"><div class="slot-h"><span>أعمال الأسبوع والشهر</span></div><div class="list">${per.map(d=>deedRow(d,k)).join('')}</div></section>`;

  return h}

/* ---------- review wizard ---------- */
const STEPS=[['day','مراجعة اليوم'],['adab','الآداب وأصول العمل'],['tazkiya','تزكية النفس'],['nafs','المعاملات والوقت'],['plans','الخطط'],['tomorrow','خطة بكرة'],['close','الختام']];
function renderReview(){const k=view.day,i=view.step,[sid,st]=STEPS[i],m=metrics(k),l=db.logs[k]||{};
  let h=backTop(st,`محاسبة الليلة · ${num(i+1)} من ${num(STEPS.length)}`,'back')+`<div class="wz-bar">${STEPS.map((_,x)=>`<i class="${x<=i?'on':''}"></i>`).join('')}</div>`;
  if(sid==='day'){const tl=timeline(k),miss=tl.filter(d=>!stOf(d,k)||stOf(d,k)==='miss');
    h+=`<div class="stats rise"><div class="stat"><b>${num(Math.round(m.pct*100),'%')}</b><span>من يومك</span></div><div class="stat"><b>${m.heart==null?'–':num(Math.round(m.heart*100),'%')}</b><span>حضور القلب في الصلاة</span></div><div class="stat"><b>${m.quality==null?'–':num(Math.round(m.quality*100),'%')}</b><span>جودة الأعمال</span></div></div>
     <p class="lead">${DISCLAIMER}</p>${miss.length?`<section class="slot"><div class="slot-h"><span>لسه ما سجّلتهاش أو فاتتك (${num(miss.length)})</span></div><div class="list">${miss.map(d=>deedRow(d,k)).join('')}</div></section>`:'<div class="notice"><span>سجّلت كل أعمال اليوم.</span></div>'}`}
  if(sid==='adab')h+=`<p class="lead">لكل نقطة: كنت فين منها النهارده؟ والتعليق اختياري.</p>`+daily(k).filter(d=>d.cat==='adab').map(d=>{const e=l[d.id]||{a:{}};return `<section class="card rise"><div class="ch"><h2>${esc(d.name)}</h2>${badge(status(d,e,k))}</div>${d.perf.map(f=>`<div class="point"><b>${esc(f.label)}</b>${fieldHTML(d,{...f,label:''},e,k).replace('<span class="lb"></span>','')}</div>`).join('')}</section>`}).join('');
  if(sid==='tazkiya'||sid==='nafs'){const ids=sid==='tazkiya'?['tazkiya']:['muamala','waqt_e'];h+=ids.map(byId).filter(d=>d&&d.on).map(d=>`<section class="card rise"><div class="ch"><h2>${esc(dname(d,k))}</h2>${badge(stOf(d,k))}</div>${deedBody(d,k)}</section>`).join('')}
  if(sid==='plans')h+=(plan(k).length?planCard(k,'خطة النهارده: اتنفذ إيه؟',false):'<div class="notice"><span>ما كانش فيه خطة لليوم ده.</span></div>')+p40Card(k);

function schedList(k){const P=timesFor(k),fr=wd(k)===5;return db.sched.items.map((it,i)=>({...it,...(fr&&it.link==='dhuhr'?{name:'صلاة الجمعة',link:'jumuah'}:{}),i,start:schedStart(it,P)})).sort((a,b)=>a.start-b.start)}
function schedNow(){if(!db.sched.on||!db.sched.items.length)return null;const now=new Date(),k=keyOf(now),m=now.getHours()*60+now.getMinutes(),L=schedList(k);
  let cur=null,next=null;for(const it of L){if(it.start<=m)cur=it;else{next=it;break}}
  if(cur&&cur.dur&&m>=cur.start+cur.dur)cur=null;if(!next){const f=schedList(shift(k,1))[0];next={...f,start:f.start+1440}}return {cur,next,m}}

let auth=null;try{auth=JSON.parse(localStorage.getItem(AK)||'null')}catch(e){}
const sync={state:'idle',msg:'',busy:false};
const saveAuth=()=>{try{auth?localStorage.setItem(AK,JSON.stringify(auth)):localStorage.removeItem(AK)}catch(e){}};
const errAr=m=>/Invalid login/i.test(m)?'الإيميل أو الباسورد غلط.':/not confirmed/i.test(m)?'لسه ما أكّدتش الإيميل. افتح الإيميل اللي وصلك واضغط على اللينك، وبعدين ارجع اضغط دخول.':/already registered|duplicate key|users_email/i.test(m)?'الإيميل ده عنده حساب. اضغط "دخول".':/rate limit|too many/i.test(m)?'محاولات كتير. استنى شوية وجرّب تاني.':/password/i.test(m)?'الباسورد لازم ٦ حروف على الأقل.':/fetch|network/i.test(m)?'مفيش نت دلوقتي.':'حصلت مشكلة: '+m;
async function sbAuth(path,body){const r=await fetch(SB+'/auth/v1/'+path,{method:'POST',headers:{apikey:SBK,'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.msg||j.error_description||j.message||('HTTP '+r.status)),{status:r.status});return j}
function setSession(j){auth={at:j.access_token,rt:j.refresh_token,exp:Date.now()+((j.expires_in||3600)-60)*1000,email:(j.user&&j.user.email)||(auth&&auth.email),uid:(j.user&&j.user.id)||(auth&&auth.uid)};saveAuth()}
async function token(){if(Date.now()<auth.exp)return auth.at;try{setSession(await sbAuth('token?grant_type=refresh_token',{refresh_token:auth.rt}))}catch(e){if(e.status===400||e.status===401){auth=null;saveAuth();sync.msg='انتهت الجلسة. ادخل تاني.'}throw e}return auth.at}
async function rest(path,opt={}){const tk=await token();const r=await fetch(SB+'/rest/v1/'+path,{...opt,headers:{apikey:SBK,Authorization:'Bearer '+tk,'Content-Type':'application/json',...(opt.headers||{})}});
  if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.message||('HTTP '+r.status))}return r.status===204||r.status===201?null:r.json().catch(()=>null)}
function mergeDB(a,b){const m=cp(a),ua=(x=[],y=[])=>{const ids=new Set(x.map(o=>o&&o.id));return x.concat((y||[]).filter(o=>o&&!ids.has(o.id)))};
  ['notes','p40','journeys','people','duas','faults','deeds'].forEach(k=>m[k]=ua(a[k],b[k]));
  m.gsecs=ua(a.gsecs,b.gsecs).map(s=>{const o=(b.gsecs||[]).find(x=>x.id===s.id);return o?{...s,items:ua(s.items,o.items)}:s});
  for(const t2 in b.goals||{})m.goals[t2]=ua((a.goals||{})[t2],b.goals[t2]);
  for(const k in b.plans||{})m.plans[k]=ua((a.plans||{})[k],b.plans[k]);
  for(const k in b.reviews||{})m.reviews[k]={...b.reviews[k],...((a.reviews||{})[k]||{})};
  for(const k in b.logs||{}){const la=m.logs[k]||(m.logs[k]={}),lb=b.logs[k];for(const id in lb){if(!la[id]||JSON.stringify(lb[id]).length>JSON.stringify(la[id]).length)la[id]=lb[id]}}
  normNotes(m);return m}
const cloudState=()=>!auth?['miss','مش محفوظ أونلاين']:sync.busy?['','بيحفظ…']:!navigator.onLine?['part','من غير نت']:sync.state==='error'?['miss','مشكلة في الحفظ']:db.meta.dirty?['part','لسه ما اتحفظش']:['done','✓ محفوظ'];
const cloudChip=()=>{const [c,l]=cloudState();return `<span class="badge ${c}" data-cloud>${l}</span>`};
function paintCloud(){document.querySelectorAll('[data-cloud]').forEach(el=>el.outerHTML=cloudChip())}
function timeAgo(iso){const m=Math.round((Date.now()-Date.parse(iso))/60000);return m<1?'من شوية':m<60?`من ${num(m)} دقيقة`:m<1440?`من ${num(Math.round(m/60))} ساعة`:fmt(keyOf(new Date(iso)),{day:'numeric',month:'long'})}
async function syncNow(){if(!auth||sync.busy)return paintCloud();if(!navigator.onLine){sync.state='offline';return paintCloud()}
  sync.busy=true;paintCloud();
  try{const rows=await rest(`user_data?select=data,updated_at&user_id=eq.${auth.uid}`),r=rows&&rows[0],lastT=Date.parse(db.meta.syncedAt||0)||0;
    if(r&&Date.parse(r.updated_at)>lastT){const rem=migrate(r.data);
      if(db.meta.dirty||!lastT){db=mergeDB(db,rem);db.meta.dirty=true}else{db=rem;db.meta={...db.meta,dirty:false,syncedAt:r.updated_at}}
      saveLocal();if(sheetEl)paintSheet();else render()}
    if(!r||db.meta.dirty){const ed=db.meta.editAt,now=new Date().toISOString();
      await rest('user_data?on_conflict=user_id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:auth.uid,data:db,updated_at:now,device:navigator.userAgent.slice(0,90)})});
      db.meta.syncedAt=now;if(db.meta.editAt===ed)db.meta.dirty=false;
      if(!db.meta.snapAt||Date.now()-db.meta.snapAt>30*60e3){await rest('snapshots?on_conflict=user_id,day',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:auth.uid,day:dayKey(),data:db})});db.meta.snapAt=Date.now()}
      saveLocal()}
    sync.state='ok';sync.msg=''}
  catch(e){sync.state='error';if(!sync.msg)sync.msg=errAr(e.message)}
  sync.busy=false;paintCloud();if(view.sub==='settings'&&!sheetEl&&!document.activeElement.matches('input,textarea'))render()}
async function doLogin(signup){const email=$('#acc-email').value.trim(),password=$('#acc-pass').value;if(!email||password.length<6){toast('اكتب الإيميل وباسورد ٦ حروف على الأقل');return}
  sync.msg='';toast(signup?'بنعمل الحساب…':'بندخّلك…');
  try{const j=await sbAuth(signup?'signup':'token?grant_type=password',{email,password});
    if(j.access_token){setSession(j);db.meta.syncedAt=null;toast('أهلًا بيك. بنحفظ بياناتك…');await syncNow();toast('بياناتك اتحفظت أونلاين ✓')}
    else sync.msg=`بعتنالك إيميل تأكيد على ${email}. افتحه واضغط على اللينك (لو فتح صفحة مش شغالة تجاهلها)، وبعدين ارجع هنا واضغط "دخول".`}

function doImport(txt){const d=JSON.parse(txt);
  if(d.waqfaImport){(d.notes||[]).forEach(n=>{if(!db.notes.some(x=>x.text===n.text))db.notes.push({id:uid('n'),k:n.k||dayKey(),text:n.text,tag:n.tag||'',mosque:''})});
    (d.faults||[]).forEach(f=>{const ex=db.faults.find(x=>x.name===f.name);const o=ex||{id:uid('flt'),g:f.g||'other',name:f.name,on:true,detail:'',hist:[]};if(f.detail)o.detail=f.detail;if(f.pct!=null)o.hist.push([dayKey(),f.pct]);if(!ex)db.faults.push(o)});
    (d.duas||[]).forEach(t=>{if(!db.duas.some(x=>x.text===t))db.duas.push({id:uid('dua'),text:t,k:'mine'})});
    (d.gsecs||[]).forEach(s=>{if(!db.gsecs.some(x=>x.name===s.name))db.gsecs.push({id:uid('s'),name:s.name,items:s.items.map(t=>({id:uid('g'),text:t,done:false}))})});
    (d.p40||[]).forEach(p=>{const t=p.text||p;if(!db.p40.some(x=>x.text===t))db.p40.push({id:uid('p40'),text:t,link:p.link||null})});normNotes(db);return 'اتضافت بياناتك'}
  const d2=migrate(d);if(!d2.deeds)throw 0;db=d2;return 'اترجعت النسخة'}
const markBackup=()=>{db.settings.lastBackup=dayKey();save();render()};

/* ================= events ================= */
const toggle=(arr,v)=>{const i=arr.indexOf(v);i<0?arr.push(v):arr.splice(i,1);return arr};
function upd(){save();if(sheetEl)paintSheet();render()}
function secArr(d,s){return d[s]||(d[s]=[])}
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-tab]');if(t){view.tab=t.dataset.tab;view.sub=null;if(view.tab==='today')view.day=dayKey();closeSheet(true);render();scrollTo(0,0);return}
  const b=ev.target.closest('[data-act]');if(!b||['INPUT','TEXTAREA','SELECT'].includes(b.tagName))return;
  const a=b.dataset.act,id=b.dataset.id,d=id&&byId(id),k=view.day,fid=b.dataset.f,v=b.dataset.v;
  /* answers */
  if(['one','many','inc','cinc','finc','miss'].includes(a)&&d){const e=E(id);e.a=e.a||{};buzz();
    if(a==='one'){e.a[fid]=e.a[fid]===v?null:v;delete e.miss}
    if(a==='many'){e.a[fid]=toggle(e.a[fid]||[],v);delete e.miss}
    if(a==='inc'){e.a[fid]=Math.max(0,Number(e.a[fid]||0)+Number(b.dataset.n));delete e.miss}
    if(a==='cinc'||a==='finc'){const o=e.a[fid]||(e.a[fid]={});o[b.dataset.k]=Math.max(0,Number(o[b.dataset.k]||0)+Number(b.dataset.n))}
    if(a==='miss')e.miss=!e.miss;
    return upd()}
  if(a==='open')return openDeed(id);
  if(a==='close-sheet')return closeSheet();
  if(a==='quick')return openNote(null,true);
  /* notes */
  if(a==='note-new')return openNote(null);
  if(a==='note-open')return openNote(id);
  if(a==='nd-mode'){view.nd.mode=v;return paintSheet()}
  if(a==='nd-src'){view.nd.src=view.nd.src===v?'':v;return paintSheet()}
  if(a==='nd-top'){toggle(view.nd.topics,v);return paintSheet()}
  if(a==='nd-star'){view.nd.star=!view.nd.star;return paintSheet()}
  if(a==='nd-save'){const s=view.nd,txt=(s.text||'').trim();if(!txt){toast('اكتب الأول');return}
    if(s.mode==='plan'){plan(dayKey()).push({id:uid('p'),t:txt,done:false});save();closeSheet();toast('اتضافت لخطة النهارده');return}
    const o={text:txt,src:s.src,topics:s.topics,by:(s.by||'').trim(),star:s.star};if(s.id)Object.assign(db.notes.find(x=>x.id===s.id),o);else db.notes.push({id:uid('n'),k:dayKey(),mosque:curMosque(),...o});
    save();closeSheet();toast(s.id?'اتحفظت':'اتحفظت الفائدة ✓');return}
  if(a==='nd-del'){if(!b.dataset.sure){b.dataset.sure=1;b.textContent='متأكد؟';return}db.notes=db.notes.filter(x=>x.id!==view.nd.id);save();closeSheet();return}
  if(a==='nd-plan'){plan(shift(dayKey(),1)).push({id:uid('p'),t:(view.nd.text||'').trim(),done:false});save();toast('اتضافت لخطة بكرة');return}
  if(a==='nview'){view.nview=v;return render()}
  if(a==='ncfg')return openNoteCfg();
  if(a==='cfg-back'){const n=view.nd;openNote(n.id||null,n.quick);Object.assign(view.nd,n);return paintSheet()}
  if(a==='cfg-add'){const inp=$('#cfg-'+v),val=inp.value.trim();if(!val)return;if(!db.noteCfg[v].includes(val))db.noteCfg[v].push(val);save();return paintSheet()}
  if(a==='cfg-del'){db.noteCfg[v].splice(Number(b.dataset.i),1);save();return paintSheet()}
  if(a==='fseed'){view.fseed=(view.fseed||0)+1;return render()}
  /* account & location */
  if(a==='acc-login')return doLogin(false);
  if(a==='acc-signup')return doLogin(true);
  if(a==='acc-sync'){sync.msg='';return syncNow()}
  if(a==='acc-logout'){if(!view.logoutAsk){view.logoutAsk=true;return render()}view.logoutAsk=false;auth=null;saveAuth();sync.msg='';render();toast('خرجت من الحساب. بياناتك لسه على الموبايل.');return}
  if(a==='loc-use')return useLocation();
  if(a==='loc-mode'){if(v==='1'){if(db.settings.loc){db.settings.useLoc=true;save();return render()}return useLocation()}db.settings.useLoc=false;save();return render()}
  /* schedule */
  if(a==='sc-open')return openSchedItem(Number(b.dataset.i));
  if(a==='sc-on'){db.sched.on=v==='1';save();return render()}
  if(a==='sc-add'){const P=timesFor(keyOf(new Date())),n=new Date(),m=n.getHours()*60+n.getMinutes();db.sched.items.push({id:uid('s'),name:'عمل جديد',anchor:'clock',off:Math.ceil(m/15)*15%1440,dur:30,link:''});save();render();return openSchedItem(db.sched.items.length-1)}
  if(a==='sc-del'){if(!b.dataset.sure){b.dataset.sure=1;b.textContent='متأكد؟';return}db.sched.items.splice(Number(b.dataset.i),1);save();closeSheet();return}
  if(a==='sc-reset'){if(!view.scReset){view.scReset=true;return render()}view.scReset=false;db.sched.items=defSched();save();render();toast('رجع الجدول الأصلي');return}
  if(a==='sc-inc'){const it=db.sched.items[Number(b.dataset.i)];it.off+=Number(b.dataset.n);save();return paintSheet()}
  if(a==='sc-deed'){closeSheet(true);return openDeed(v,dayKey())}
  if(a==='qk'){view.qk=v;const t=$('#qText').value;paintSheet();$('#qText').value=t;return}
  if(a==='qk-save'){const t=$('#qText').value.trim();if(!t){toast('اكتب الأول');return}if(view.qk==='note')addNote(t,NTAGS[0]);else plan(dayKey()).push({id:uid('p'),t,done:false});save();closeSheet();toast('اتحفظ');return}
  /* plans */
  if(a==='pl-tog'){const x=plan(b.dataset.k)[b.dataset.i];x.done=!x.done;buzz();return upd()}
  if(a==='pl-del'){plan(b.dataset.k).splice(b.dataset.i,1);return upd()}
  if(a==='pl-add'){const inp=document.getElementById('pl-'+b.dataset.k),val=inp.value.trim();if(!val){toast('اكتب الخطوة الأول');return}plan(b.dataset.k).push({id:uid('p'),t:val,done:false});upd();const n2=document.getElementById('pl-'+b.dataset.k);n2&&n2.focus();return}
  if(a==='p40-edit')return openP40();
  if(a==='p40-add'){const v2=$('#p40-new').value.trim();if(!v2){toast('اكتب البند الأول');return}db.p40.push({id:uid('p40'),text:v2,link:$('#p40-newlink').value||null});save();paintSheet();render();toast('اتضاف');return}
  if(a==='p40-del'){if(!b.dataset.sure){b.dataset.sure=1;b.style.color='var(--alert)';toast('اضغط تاني للمسح');return}db.p40=db.p40.filter(x=>x.id!==id);save();paintSheet();return render()}
  if(a==='p40-mv'){const i=db.p40.findIndex(x=>x.id===id),j=i+Number(b.dataset.n);if(j<0||j>=db.p40.length)return;[db.p40[i],db.p40[j]]=[db.p40[j],db.p40[i]];save();paintSheet();return render()}
  if(a==='p40'){const l=logOf(k);l._p40=toggle(l._p40||[],id);buzz();return upd()}
  /* navigation */
  if(a==='go'){view.sub=v;if(v==='review')view.step=0;view.endAsk=false;closeSheet(true);render();scrollTo(0,0);return}
  if(a==='back'){view.sub=null;render();scrollTo(0,0);return}
  if(a==='go-khuruj'){view.sub='khuruj';return render()}
  if(a==='go-settings'){view.sub='settings';return render()}
  if(a==='go-custom'){view.sub='custom';return render()}
  if(a==='settings'){view.sub='settings';render();scrollTo(0,0);return}
  if(a==='cat'){view.sub='cat';view.cat=v;render();scrollTo(0,0);return}
  if(a==='filter'){view.filter=v;return render()}
  if(a==='go-today'){view.day=dayKey();return render()}
  if(a==='open-day'){view.day=b.dataset.k;view.tab='today';view.sub=null;render();scrollTo(0,0);return}
  if(a==='ready'){view.ready++;return render()}
